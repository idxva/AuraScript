<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AuraScript Provider Portal">
    <title>AuraScript | Practitioner Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-wrapper">
        <main class="auth-card">

            <!-- Card Header -->
            <div class="auth-header">
                <div class="auth-brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <h1 class="auth-title">AuraScript Provider Portal</h1>
                <p class="auth-subtitle">Verify your practitioner identity to issue encrypted digital prescriptions</p>
            </div>

            <!-- Card Body -->
            <div class="auth-body">

                <!-- Fast Demo Profiles for Clinical Testing -->
                <div class="demo-physicians-section">
                    <div class="demo-title">
                        <span>Quick Clinical Select (Demo)</span>
                        <span>1-Click</span>
                    </div>
                    <div class="demo-chips">
                        <button type="button" class="demo-chip-btn" id="demoPriya">
                            <strong>Dr. Priya Nair, MD</strong>
                            <span class="demo-chip-role">City Care Medical · Cardiology</span>
                        </button>
                        <button type="button" class="demo-chip-btn" id="demoMarcus">
                            <strong>Dr. Marcus Vance, MD</strong>
                            <span class="demo-chip-role">St. Jude Regional · Internal Med</span>
                        </button>
                        <button type="button" class="demo-chip-btn" id="demoElena">
                            <strong>Dr. Elena Rostova, MD</strong>
                            <span class="demo-chip-role">Metro Health · Pediatrics</span>
                        </button>
                    </div>
                </div>

                <div class="auth-divider">
                    <span>Or Enter Credentials</span>
                </div>

                <!-- Physician Login / Identity Setup Form -->
                <form class="auth-form" id="loginForm" autocomplete="on">
                    <div class="auth-field">
                        <label class="auth-label" for="loginEmail">Practitioner Name or Clinical Email</label>
                        <input
                            type="text"
                            id="loginEmail"
                            name="email"
                            placeholder="e.g. Dr. Priya Nair or priya.nair@clinic.org"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="loginClinic">Clinic / Facility Name</label>
                        <input
                            type="text"
                            id="loginClinic"
                            name="clinic"
                            placeholder="e.g. City Care Medical Center"
                            value="City Care Medical Center"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="loginPassword">License No. / Access PIN</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-submit-btn" id="btnSubmit">
                        Authenticate &amp; Open Prescription Station
                    </button>
                </form>

                <!-- Institutional Compliance Footer -->
                <div class="auth-compliance-footer">
                    <span class="auth-compliance-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        AES-256 Local Encrypted
                    </span>
                    <span class="auth-compliance-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        PharmaLink Ready
                    </span>
                </div>

            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

    <script>
        function showToast(message, type = 'info') {
            const region = document.getElementById('toastRegion');
            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;
            toast.textContent = message;
            region.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('is-leaving');
                toast.addEventListener('animationend', () => toast.remove(), { once: true });
            }, 2500);
        }

        function completeLogin(doctorName, clinicName) {
            const profile = {
                doctorName: doctorName || 'Dr. Physician, MD',
                clinicName: clinicName || 'City Care Medical Center'
            };
            localStorage.setItem('aura_doctor_profile', JSON.stringify(profile));
            showToast('Practitioner authenticated. Loading workstation...', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }

        // Email / Name Form Submit
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('loginEmail').value.trim();
            const clinicInput = document.getElementById('loginClinic').value.trim() || 'City Care Medical Center';

            if (!emailInput) {
                showToast('Please enter your practitioner name or email.', 'error');
                return;
            }

            let displayName = emailInput;
            if (emailInput.includes('@')) {
                const username = emailInput.split('@')[0];
                const cleanName = username.replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                displayName = cleanName.toLowerCase().startsWith('dr') ? cleanName : `Dr. ${cleanName}, MD`;
            } else if (!displayName.toLowerCase().startsWith('dr')) {
                displayName = `Dr. ${displayName}`;
            }

            completeLogin(displayName, clinicInput);
        });

        // Fast Demo Profile Buttons
        document.getElementById('demoPriya').addEventListener('click', () => {
            completeLogin('Dr. Priya Nair, MD', 'City Care Medical · Cardiology');
        });

        document.getElementById('demoMarcus').addEventListener('click', () => {
            completeLogin('Dr. Marcus Vance, MD', 'St. Jude Regional · Internal Medicine');
        });

        document.getElementById('demoElena').addEventListener('click', () => {
            completeLogin('Dr. Elena Rostova, MD', 'Metro Health Network · Pediatrics');
        });

        // Pre-fill if a profile already exists
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('aura_doctor_profile');
            if (saved) {
                try {
                    const profile = JSON.parse(saved);
                    if (profile.doctorName) {
                        const emailField = document.getElementById('loginEmail');
                        if (emailField) emailField.value = profile.doctorName;
                    }
                    if (profile.clinicName) {
                        const clinicField = document.getElementById('loginClinic');
                        if (clinicField) clinicField.value = profile.clinicName;
                    }
                } catch (e) { /* ignore */ }
            }
        });
    </script>

</body>

</html>
